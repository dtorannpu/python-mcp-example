services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    ports:
      - "8001:8001"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
