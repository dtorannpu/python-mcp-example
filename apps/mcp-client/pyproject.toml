[project]
name = "mcp-client"
version = "0.1.0"
description = "OAuth (PKCE) 対応の MCP クライアント CLI"
readme = "README.md"
authors = [
    { name = "dtorannpu", email = "dtorannpu@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx2>=2.16.0",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
mcp-client = "mcp_client.main:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
